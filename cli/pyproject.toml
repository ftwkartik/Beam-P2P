[project]
name = "beam-cli"
version = "0.1.0"
description = "Command-line peer for Beam: send and receive files from a terminal, interoperable with the web client."
requires-python = ">=3.12"
dependencies = [
    "beam-protocol",
    "typer>=0.13.0",
    "rich>=13.9.0",
]

[project.scripts]
beam = "beam_cli.main:app"

[tool.uv.sources]
beam-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_cli"]
