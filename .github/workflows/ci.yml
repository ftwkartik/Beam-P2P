name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: beam
          POSTGRES_PASSWORD: beam  # pragma: allowlist secret -- CI-only, not a real credential
          POSTGRES_DB: beam_test
        options: >-
          --health-cmd "pg_isready -U beam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql+asyncpg://beam:beam@localhost:5432/beam_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy protocol/src server/src cli/src

      - name: Test (pytest)
        run: uv run pytest -v

      - name: Protocol schema and shared data are not stale
        run: |
          uv run python -m beam_protocol.export_schema
          uv run python -m beam_protocol.export_data
          git diff --exit-code -- protocol/schema

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Generated protocol types and shared data are not stale
        run: npm run codegen:check

      - name: Test (vitest)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f server/Dockerfile -t beam-server:ci .

      - name: Build web image
        run: docker build -f web/Dockerfile -t beam-web:ci .

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No API keys or paid services (see .env.example) -- just random local secrets.
      - name: Generate secrets
        run: cp .env.example .env && ./scripts/gen_secrets.sh

      # e2e/interop.spec.ts spawns a real `beam` CLI subprocess (via `uv run`)
      # against the compose stack, alongside the browser -- needs Python/uv on PATH.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --all-packages --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright's browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts's webServer brings up the full compose stack itself
      # (server, nginx, Redis, coturn) since CI never reuses an existing one, waits
      # for /health, runs the suite, then tears it down.
      - name: Run the E2E suite
        working-directory: web
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs || true
