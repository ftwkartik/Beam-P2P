# Local development / demo stack. `docker compose up --build` after
# `cp .env.example .env && ./scripts/gen_secrets.sh` (see README.md).
#
# `server` runs 2 replicas by default (Milestone 5: no server holds any state a peer's
# messages depend on beyond Redis, so any instance can serve any peer -- see
# docs/architecture.md §5 and docs/adr/002-redis-state-and-pubsub.md). nginx is the
# only public entry point to it; scale further with `docker compose up --scale
# server=N`. `coturn` provides TURN with ephemeral HMAC credentials the API mints
# (Milestone 6; docs/adr/004-turn-coturn-ephemeral-credentials.md) using
# infra/coturn/turnserver.conf, a dev-only config -- see that file and
# turnserver.prod.conf for what changes in production. Postgres only if the
# accounts/history option in Milestone 11 is taken (see docs/roadmap.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beam
      POSTGRES_PASSWORD: beam  # pragma: allowlist secret -- local dev-only, not a real credential
      POSTGRES_DB: beam
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beam"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  coturn:
    image: coturn/coturn:4.6.2-alpine
    restart: unless-stopped
    # `docker compose` expands ${TURN_SECRET} itself, at compose-file parse time, by
    # reading the project's root .env -- the same file the server container gets its
    # copy of TURN_SECRET from (see server's env_file below). Passing it as a
    # command-line flag (which coturn lets override a file directive) means the real
    # secret is never written into turnserver.conf, an image layer, or git.
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET}"]
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://beam:beam@postgres:5432/beam  # pragma: allowlist secret
      TURN_URLS: '["turn:localhost:3478?transport=udp","turn:localhost:3478?transport=tcp"]'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      coturn:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # No fixed host port: two replicas can't both bind the same one, and nginx (below)
    # is the intended public entry point anyway. Reach a specific replica directly for
    # debugging with `docker compose exec server-N curl ...` or a one-off port
    # mapping override.
    expose:
      - "8000"
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  redis-data:
  postgres-data:
