# Local development / demo stack. `docker compose up --build` after
# `cp .env.example .env && ./scripts/gen_secrets.sh` (see README.md).
#
# `server` runs 2 replicas by default (Milestone 5: no server holds any state a peer's
# messages depend on beyond Redis, so any instance can serve any peer -- see
# docs/architecture.md §5 and docs/adr/002-redis-state-and-pubsub.md). nginx is the
# only public entry point to it; scale further with `docker compose up --scale
# server=N`. TURN (coturn) arrives in Milestone 6; Postgres only if the
# accounts/history option in Milestone 11 is taken (see docs/roadmap.md).

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    # No fixed host port: two replicas can't both bind the same one, and nginx (below)
    # is the intended public entry point anyway. Reach a specific replica directly for
    # debugging with `docker compose exec server-N curl ...` or a one-off port
    # mapping override.
    expose:
      - "8000"
    deploy:
      replicas: 2

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  redis-data:
