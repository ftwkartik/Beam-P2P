[project]
name = "beam-workspace"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["protocol", "server", "cli"]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "fakeredis>=2.26.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["protocol/src", "server/src", "cli/src"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pyflakes / pycodestyle
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "S",                # bandit (security)
    "C4",               # comprehensions
    "SIM",              # simplify
    "RUF",              # ruff-specific
]
ignore = ["S101"]  # allow assert (used in tests and defensive checks)

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and dummy secrets in tests
# Typer's own recommended pattern is typer.Argument(...)/typer.Option(...) as a
# parameter default; bugbear's "no function calls in defaults" doesn't apply to it.
"cli/src/beam_cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["protocol/src", "server/src", "cli/src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "aiortc.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["server/tests", "protocol/tests", "cli/tests"]
