# Serves the built web client and reverse-proxies the API and signaling WebSocket to
# the FastAPI server. See docs/architecture.md §1 for the overall request flow.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (127.0.0.11) resolves the "server" service name. Using a
    # variable in proxy_pass makes nginx resolve it lazily, per request, instead of
    # once at startup — so this image still starts (and serves static files) even if
    # the backend isn't reachable yet or the image is run standalone without compose.
    # Deliberately no path after $backend below: with a variable, nginx does not do
    # its usual location-prefix rewriting, so proxy_pass with a trailing path would
    # send that literal path upstream instead of the request's actual path. With no
    # path, nginx falls back to forwarding the original request URI unchanged, which
    # is what every location here wants (no prefix stripping).
    resolver 127.0.0.11 valid=10s;
    set $backend "http://server:8000";

    # Never let a stale HTML shell be cached; hashed assets under /assets/ are
    # immutable and get a long cache lifetime instead (below).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: any path that isn't a static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend;
    }

    # Signaling WebSocket (Milestone 4). Upgrade headers are required for the
    # connection to switch protocols; the generous timeout keeps idle connections
    # alive between the app's own ping/pong heartbeats (docs/protocol.md §3).
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
