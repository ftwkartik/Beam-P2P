# coturn config for local development (docs/adr/004-turn-coturn-ephemeral-credentials.md;
# docs/security.md §3). Production uses infra/coturn/turnserver.prod.conf instead --
# see that file for what's different and why.
#
# static-auth-secret is intentionally NOT set here: docker-compose.yml passes it on
# the command line (`--static-auth-secret=${TURN_SECRET}`), which coturn lets override
# a file directive, so the real secret never has to be written into a file baked into
# an image or checked into git.

listening-port=3478
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
use-auth-secret
realm=beam.local

# Relaxed on purpose for local dev: two browser tabs on the same machine (or two
# containers on the compose network) exchange loopback/private-range candidates, which
# production's denied-peer-ip list below would otherwise block outright, making TURN
# untestable locally. This is safe here only because the dev stack is not
# internet-facing (docs/adr/004, "Trade-offs").
no-multicast-peers

no-cli
no-tlsv1
no-tlsv1_1
stale-nonce

# Keeps a runaway local test from ever being mistaken for realistic load.
user-quota=12
total-quota=100
max-bps=2000000

log-file=stdout
