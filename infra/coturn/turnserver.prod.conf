# coturn config template for production (docs/adr/004-turn-coturn-ephemeral-credentials.md;
# docs/security.md §3). Copy this alongside the deployment, fill in the placeholders
# below, and point coturn at it instead of turnserver.conf. static-auth-secret is
# still passed on the command line, not written here (see turnserver.conf's comment).
#
# Placeholders to fill in:
#   REPLACE_WITH_REALM        e.g. turn.example.com
#   REPLACE_WITH_EXTERNAL_IP  the server's public IP (needed behind any NAT/cloud LB)
#   REPLACE_WITH_CERT_PATH / REPLACE_WITH_KEY_PATH   TLS cert/key for turns:5349

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
use-auth-secret
realm=REPLACE_WITH_REALM
external-ip=REPLACE_WITH_EXTERNAL_IP

cert=REPLACE_WITH_CERT_PATH
pkey=REPLACE_WITH_KEY_PATH

# No open relay into any private network (docs/security.md §3): without this, valid
# ephemeral credentials could be used to make coturn proxy arbitrary traffic at
# internal/cloud-metadata addresses -- a known class of TURN misconfiguration.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
stale-nonce

# Bounds relay bandwidth abuse per allocation and in aggregate (docs/security.md §6,
# "Denial of service"). Tune to the deployment's actual capacity.
user-quota=12
total-quota=1200
max-bps=1000000

log-file=/var/log/turnserver.log
