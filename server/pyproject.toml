[project]
name = "beam-server"
version = "0.1.0"
description = "Beam signaling server: rooms, WebSocket signaling relay and TURN credential minting."
requires-python = ">=3.12"
dependencies = [
    "beam-protocol",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "pyjwt>=2.9.0",
    "prometheus-client>=0.21.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "argon2-cffi>=23.1.0",
]

[tool.uv.sources]
beam-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_server"]
