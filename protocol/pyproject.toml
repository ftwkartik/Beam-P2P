[project]
name = "beam-protocol"
version = "0.1.0"
description = "Shared signaling/peer protocol definitions for the Beam server, CLI and web client."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_protocol"]
